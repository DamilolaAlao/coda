zerops:
  - setup: app
    build:
      os: ubuntu
      base: nodejs@24
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y python3 python3-venv make g++ curl git ca-certificates
      buildCommands:
        - npm i --omit=dev --ignore-scripts=false
        - test -d node_modules/@ff-labs/fff-node
        - npm rebuild node-pty --foreground-scripts || true
        - chmod +x install-hermes.sh start.sh hermes-wrapper.sh
        - ./install-hermes.sh
      deployFiles: ./
    run:
      os: ubuntu
      base: nodejs@24
      ports:
        - port: 3773
          httpSupport: true
      envVariables:
        NODE_ENV: production
        T3CODE_HOST: 0.0.0.0
        T3CODE_PORT: "3773"
        T3CODE_HOME: /var/www/.t3
        T3CODE_PUBLIC_URL: https://app-3069-3773.prg1.zerops.app
        HERMES_HOME: /var/www/vendor/hermes-home
      initCommands:
        - npm i --omit=dev --ignore-scripts=false
        - test -d /var/www/node_modules/@ff-labs/fff-node
        - test -x /var/www/bin/hermes
        - /var/www/bin/hermes --version
        - mkdir -p /var/www/vendor/hermes-home
        - |
          if [ ! -f /var/www/vendor/hermes-home/config.yaml ]; then
            printf 'model:\n  default: kimi-k3\n  provider: opencode-go\n' > /var/www/vendor/hermes-home/config.yaml
          fi
      start: ./start.sh
