zerops:
  - setup: stack
    build:
      os: ubuntu
      base: nodejs@24
      buildCommands:
        - "true"
      deployFiles: ./
      addToRunPrepare:
        - package.json
        - install-hermes.sh
        - hermes-wrapper.sh
    run:
      os: ubuntu
      base: nodejs@24
      # Native Node runtime (not Docker VMs) so Automatic Scaling can move CPU/RAM/disk.
      # Keep a single container: T3 SQLite is process-local, not HA.
      minContainers: 1
      maxContainers: 1
      verticalAutoscaling:
        cpuMode: SHARED
        minCpu: 1
        maxCpu: 5
        minRam: 2
        maxRam: 8
        minDisk: 10
        maxDisk: 40
        startCpuCoreCount: 2
      prepareCommands:
        - sudo apt-get update
        - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv make g++ curl git gh ca-certificates
        - npm i --prefix /home/zerops --omit=dev --ignore-scripts=false
        - test -d /home/zerops/node_modules/@ff-labs/fff-node
        - npm rebuild node-pty --prefix /home/zerops --foreground-scripts || true
        - chmod +x install-hermes.sh hermes-wrapper.sh
        - ./install-hermes.sh
      ports:
        - port: 3773
          httpSupport: true
      volume:
        hostname: data
        mountPath: /srv/coda-data
      envVariables:
        NODE_ENV: production
        IMAGE_TAG: __IMAGE_TAG__
        T3CODE_HOST: 0.0.0.0
        T3CODE_PORT: "3773"
        CODA_DATA_ROOT: /srv/coda-data
        T3CODE_HOME: /srv/coda-data/.t3
        HOME: /srv/coda-data/coda
        CODA_DEPLOYMENTS_HOME: /srv/coda-data/deployments
        T3CODE_PUBLIC_URL: __T3CODE_PUBLIC_URL__
        T3CODE_PAIRING_CODE: "__T3CODE_PAIRING_CODE__"
      start: /bin/sh /var/www/start.sh
