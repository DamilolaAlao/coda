zerops:
  - setup: stack
    build:
      os: ubuntu
      base: nodejs@24
      buildCommands:
        - "true"
      deployFiles: ./
    run:
      os: ubuntu
      base: docker@26.1
      verticalAutoscaling:
        cpu: 2
        ram: 4
        disk: 20
      ports:
        - port: 3773
          httpSupport: true
      envVariables:
        NODE_ENV: production
        IMAGE_TAG: __IMAGE_TAG__
        T3CODE_HOST: 0.0.0.0
        T3CODE_PORT: "3773"
        T3CODE_HOME: /data
        T3CODE_PUBLIC_URL: https://stack-3069-3773.prg1.zerops.app
        # Runtime secret only. Do not bake this into the image or web bundle.
        T3CODE_PAIRING_CODE: "722110"
        HERMES_HOME: /app/vendor/hermes-home
      start: /bin/sh /var/www/run.sh
